<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='256' height='256'>
  <defs>
    <linearGradient id='budStemGrad' x1='0.5' y1='1' x2='0.5' y2='0'>
      <stop offset='0%' stop-color='#16a34a'/>
      <stop offset='100%' stop-color='#4ade80'/>
    </linearGradient>
    <linearGradient id='petalGradL' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#fda4af'/>
      <stop offset='50%' stop-color='#f43f5e'/>
      <stop offset='100%' stop-color='#be123c'/>
    </linearGradient>
    <linearGradient id='petalGradR' x1='1' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f43f5e'/>
      <stop offset='60%' stop-color='#e11d48'/>
      <stop offset='100%' stop-color='#9f1239'/>
    </linearGradient>
    <linearGradient id='petalGradC' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#fff1f2'/>
      <stop offset='40%' stop-color='#fecdd3'/>
      <stop offset='100%' stop-color='#fb7185'/>
    </linearGradient>
    <filter id='budGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#9f1239' flood-opacity='0.4'/>
    </filter>
  </defs>

  <!-- Stem & Side Leaves -->
  <path d='M32 56 C 31 46, 33 36, 32 30' stroke='url(#budStemGrad)' stroke-width='6' stroke-linecap='round'/>
  <path d='M31 44 C 20 43, 10 40, 11 32 C 12 25, 23 29, 31 40 Z' fill='#22c55e' stroke='#15803d' stroke-width='1.5'/>
  <path d='M33 44 C 44 43, 54 40, 53 32 C 52 25, 41 29, 33 40 Z' fill='#16a34a' stroke='#15803d' stroke-width='1.5'/>

  <!-- Green Calyx Sepals cradling the bud -->
  <path d='M32 35 C 23 35, 18 27, 20 22 C 24 27, 28 32, 32 35 Z' fill='#15803d'/>
  <path d='M32 35 C 41 35, 46 27, 44 22 C 40 27, 36 32, 32 35 Z' fill='#166534'/>

  <!-- Plump Flower Bud with 3D overlapping petals -->
  <!-- Left Petal -->
  <path d='M32 32 C 20 31, 16 20, 24 12 C 28 8, 32 14, 32 32 Z' fill='url(#petalGradL)' stroke='#881337' stroke-width='1.5' filter='url(#budGlow)'/>
  <!-- Right Petal -->
  <path d='M32 32 C 44 31, 48 20, 40 12 C 36 8, 32 14, 32 32 Z' fill='url(#petalGradR)' stroke='#881337' stroke-width='1.5' filter='url(#budGlow)'/>
  <!-- Center Heart Petal -->
  <path d='M32 32 C 26 28, 24 18, 29 11 C 32 8, 35 11, 38 18 C 40 28, 38 28, 32 32 Z' fill='url(#petalGradC)' stroke='#9f1239' stroke-width='1.2'/>

  <!-- Glossy Highlights -->
  <ellipse cx='26' cy='16' rx='3' ry='6' transform='rotate(-20 26 16)' fill='#ffffff' opacity='0.6'/>
  <ellipse cx='32' cy='14' rx='2' ry='4' fill='#ffffff' opacity='0.75'/>

  <!-- Golden Magic Pollen Dust -->
  <circle cx='46' cy='12' r='1.8' fill='#fde047'/>
  <circle cx='18' cy='10' r='1.4' fill='#fef08a'/>
  <circle cx='42' cy='7' r='1.2' fill='#ffffff'/>
</svg>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='256' height='256'>
  <defs>
    <radialGradient id='soilGrad' cx='50%' cy='40%' r='60%'>
      <stop offset='0%' stop-color='#9a3412'/>
      <stop offset='70%' stop-color='#7c2d12'/>
      <stop offset='100%' stop-color='#451a03'/>
    </radialGradient>
    <linearGradient id='stemGrad' x1='0.5' y1='1' x2='0.5' y2='0'>
      <stop offset='0%' stop-color='#22c55e'/>
      <stop offset='60%' stop-color='#4ade80'/>
      <stop offset='100%' stop-color='#86efac'/>
    </linearGradient>
    <linearGradient id='leafGradL' x1='1' y1='1' x2='0' y2='0'>
      <stop offset='0%' stop-color='#16a34a'/>
      <stop offset='50%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#86efac'/>
    </linearGradient>
    <linearGradient id='leafGradR' x1='0' y1='1' x2='1' y2='0'>
      <stop offset='0%' stop-color='#15803d'/>
      <stop offset='50%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#bbf7d0'/>
    </linearGradient>
    <filter id='softShadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='3' stdDeviation='2.5' flood-color='#14532d' flood-opacity='0.35'/>
    </filter>
  </defs>

  <!-- Soil mound -->
  <ellipse cx='32' cy='52' rx='22' ry='8' fill='url(#soilGrad)' stroke='#451a03' stroke-width='2'/>
  <ellipse cx='32' cy='50' rx='18' ry='5' fill='#b45309' opacity='0.4'/>
  <circle cx='24' cy='51' r='2' fill='#d97706'/>
  <circle cx='38' cy='52' r='1.5' fill='#d97706'/>

  <!-- Curved sprout stem -->
  <path d='M32 50 C 31 42, 33 34, 32 26' stroke='url(#stemGrad)' stroke-width='5.5' stroke-linecap='round' filter='url(#softShadow)'/>

  <!-- Left leaf -->
  <path d='M32 30 C 24 28, 12 25, 12 18 C 12 12, 22 15, 31 27 Z' fill='url(#leafGradL)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow)'/>
  <path d='M30 25 C 24 23, 17 20, 15 16' stroke='#bbf7d0' stroke-width='1' stroke-linecap='round' opacity='0.7'/>
  <!-- Leaf highlight -->
  <ellipse cx='20' cy='17' rx='4' ry='2' transform='rotate(-20 20 17)' fill='#ffffff' opacity='0.55'/>

  <!-- Right leaf -->
  <path d='M32 30 C 40 28, 52 25, 52 18 C 52 12, 42 15, 33 27 Z' fill='url(#leafGradR)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow)'/>
  <path d='M34 25 C 40 23, 47 20, 49 16' stroke='#bbf7d0' stroke-width='1' stroke-linecap='round' opacity='0.7'/>
  <!-- Leaf highlight -->
  <ellipse cx='44' cy='17' rx='4' ry='2' transform='rotate(20 44 17)' fill='#ffffff' opacity='0.55'/>

  <!-- Sparkling Dewdrop on left tip -->
  <circle cx='12' cy='18' r='2.2' fill='#e0f2fe' stroke='#ffffff' stroke-width='0.8'/>
  <circle cx='11.5' cy='17.5' r='0.8' fill='#ffffff'/>
</svg>
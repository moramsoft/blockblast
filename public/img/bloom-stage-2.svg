<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='256' height='256'>
  <defs>
    <radialGradient id='soilGrad2' cx='50%' cy='40%' r='60%'>
      <stop offset='0%' stop-color='#9a3412'/>
      <stop offset='70%' stop-color='#7c2d12'/>
      <stop offset='100%' stop-color='#451a03'/>
    </radialGradient>
    <linearGradient id='stemGrad2' x1='0.5' y1='1' x2='0.5' y2='0'>
      <stop offset='0%' stop-color='#16a34a'/>
      <stop offset='50%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#86efac'/>
    </linearGradient>
    <linearGradient id='leafGrad2A' x1='1' y1='1' x2='0' y2='0'>
      <stop offset='0%' stop-color='#15803d'/>
      <stop offset='60%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#86efac'/>
    </linearGradient>
    <linearGradient id='leafGrad2B' x1='0' y1='1' x2='1' y2='0'>
      <stop offset='0%' stop-color='#166534'/>
      <stop offset='60%' stop-color='#22c55e'/>
      <stop offset='100%' stop-color='#bbf7d0'/>
    </linearGradient>
    <filter id='softShadow2' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='3' stdDeviation='2.5' flood-color='#14532d' flood-opacity='0.35'/>
    </filter>
  </defs>

  <!-- Soil -->
  <ellipse cx='32' cy='54' rx='21' ry='7' fill='url(#soilGrad2)' stroke='#451a03' stroke-width='2'/>

  <!-- Sturdy stem reaching higher -->
  <path d='M32 52 C 30 40, 34 26, 32 14' stroke='url(#stemGrad2)' stroke-width='6' stroke-linecap='round' filter='url(#softShadow2)'/>

  <!-- Lower pair leaves -->
  <path d='M31 38 C 22 37, 10 35, 10 27 C 10 20, 21 23, 31 34 Z' fill='url(#leafGrad2A)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow2)'/>
  <ellipse cx='19' cy='26' rx='4.5' ry='2.2' transform='rotate(-20 19 26)' fill='#ffffff' opacity='0.5'/>

  <path d='M33 38 C 42 37, 54 35, 54 27 C 54 20, 43 23, 33 34 Z' fill='url(#leafGrad2B)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow2)'/>
  <ellipse cx='45' cy='26' rx='4.5' ry='2.2' transform='rotate(20 45 26)' fill='#ffffff' opacity='0.5'/>

  <!-- Upper pair leaves -->
  <path d='M32 24 C 25 21, 15 17, 16 11 C 17 6, 26 9, 32 20 Z' fill='url(#leafGrad2A)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow2)'/>
  <ellipse cx='23' cy='12' rx='3.5' ry='1.8' transform='rotate(-25 23 12)' fill='#ffffff' opacity='0.55'/>

  <path d='M32 24 C 39 21, 49 17, 48 11 C 47 6, 38 9, 32 20 Z' fill='url(#leafGrad2B)' stroke='#15803d' stroke-width='1.5' filter='url(#softShadow2)'/>
  <ellipse cx='41' cy='12' rx='3.5' ry='1.8' transform='rotate(25 41 12)' fill='#ffffff' opacity='0.55'/>

  <!-- Tender tip bud -->
  <circle cx='32' cy='12' r='3.5' fill='#86efac' stroke='#16a34a' stroke-width='1.5'/>
  <circle cx='31' cy='10.5' r='1.2' fill='#ffffff'/>
</svg>
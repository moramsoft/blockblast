<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='256' height='256'>
  <defs>
    <radialGradient id='bloomGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fef08a' stop-opacity='0.9'/>
      <stop offset='60%' stop-color='#facc15' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#eab308' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='pPink' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#f43f5e'/><stop offset='100%' stop-color='#fda4af'/>
    </linearGradient>
    <linearGradient id='pGold' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#eab308'/><stop offset='100%' stop-color='#fef08a'/>
    </linearGradient>
    <linearGradient id='pCyan' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#0284c7'/><stop offset='100%' stop-color='#7dd3fc'/>
    </linearGradient>
    <linearGradient id='pPurple' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#9333ea'/><stop offset='100%' stop-color='#d8b4fe'/>
    </linearGradient>
    <linearGradient id='pGreen' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#16a34a'/><stop offset='100%' stop-color='#86efac'/>
    </linearGradient>
    <linearGradient id='coreGrad' x1='0.5' y1='0' x2='0.5' y2='1'>
      <stop offset='0%' stop-color='#fffbeb'/>
      <stop offset='40%' stop-color='#fde047'/>
      <stop offset='100%' stop-color='#f59e0b'/>
    </linearGradient>
    <filter id='bloomDrop' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#7c2d12' flood-opacity='0.35'/>
    </filter>
  </defs>

  <!-- Golden Aura Halo -->
  <circle cx='32' cy='32' r='30' fill='url(#bloomGlow)'/>

  <!-- 8 Petals in a Circle -->
  <!-- Top, TopRight, Right, BottomRight, Bottom, BottomLeft, Left, TopLeft -->
  <g filter='url(#bloomDrop)'>
    <circle cx='32' cy='14' r='10' fill='url(#pPink)' stroke='#be123c' stroke-width='1.5'/>
    <circle cx='45' cy='19' r='10' fill='url(#pGold)' stroke='#a16207' stroke-width='1.5'/>
    <circle cx='50' cy='32' r='10' fill='url(#pCyan)' stroke='#0369a1' stroke-width='1.5'/>
    <circle cx='45' cy='45' r='10' fill='url(#pPurple)' stroke='#7e22ce' stroke-width='1.5'/>
    <circle cx='32' cy='50' r='10' fill='url(#pPink)' stroke='#be123c' stroke-width='1.5'/>
    <circle cx='19' cy='45' r='10' fill='url(#pGreen)' stroke='#15803d' stroke-width='1.5'/>
    <circle cx='14' cy='32' r='10' fill='url(#pCyan)' stroke='#0369a1' stroke-width='1.5'/>
    <circle cx='19' cy='19' r='10' fill='url(#pGold)' stroke='#a16207' stroke-width='1.5'/>
  </g>

  <!-- Petal Highlights -->
  <ellipse cx='32' cy='8' rx='4' ry='2' fill='#ffffff' opacity='0.6'/>
  <ellipse cx='47' cy='14' rx='3' ry='2' transform='rotate(45 47 14)' fill='#ffffff' opacity='0.6'/>
  <ellipse cx='53' cy='30' rx='2' ry='3' fill='#ffffff' opacity='0.6'/>
  <ellipse cx='11' cy='30' rx='2' ry='3' fill='#ffffff' opacity='0.6'/>
  <ellipse cx='17' cy='14' rx='3' ry='2' transform='rotate(-45 17 14)' fill='#ffffff' opacity='0.6'/>

  <!-- Golden Smiling Center Core -->
  <circle cx='32' cy='32' r='13' fill='url(#coreGrad)' stroke='#9a3412' stroke-width='2'/>
  <ellipse cx='28' cy='24' rx='6' ry='3' fill='#ffffff' opacity='0.65'/>

  <!-- Cute Smiling Mascot Face on Core -->
  <circle cx='28' cy='31' r='2' fill='#451a03'/>
  <circle cx='36' cy='31' r='2' fill='#451a03'/>
  <circle cx='27.2' cy='30.2' r='0.7' fill='#ffffff'/>
  <circle cx='35.2' cy='30.2' r='0.7' fill='#ffffff'/>
  <!-- Cheeks -->
  <ellipse cx='25' cy='33.5' rx='2' ry='1.2' fill='#f43f5e' opacity='0.7'/>
  <ellipse cx='39' cy='33.5' rx='2' ry='1.2' fill='#f43f5e' opacity='0.7'/>
  <!-- Open mouth smile -->
  <path d='M30 34.5 Q 32 38 34 34.5 Z' fill='#b91c1c' stroke='#451a03' stroke-width='0.8'/>

  <!-- Sparkle stars -->
  <path d='M10 12 L12 10 L10 8 L8 10 Z' fill='#ffffff'/>
  <path d='M54 14 L56 12 L54 10 L52 12 Z' fill='#fef08a'/>
  <path d='M52 50 L54 48 L52 46 L50 48 Z' fill='#ffffff'/>
  <path d='M12 50 L14 48 L12 46 L10 48 Z' fill='#fef08a'/>
</svg>